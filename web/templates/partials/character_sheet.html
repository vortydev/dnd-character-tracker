<article class="char-sheet">
    <section class="char-sheet-header">
        <div class="char-name char-field-wrapper">
            <p class="char-name-text">Ava</p>
            <input type="text" id="charName" class="form-control hidden" disabled />
            <label for="charName" class="char-field-label">Character name</label>
        </div>

        <div class="char-info">
            <div class="char-class char-field-wrapper">
                <p>Divine Soul <strong>Sorcerer</strong></p>
                <label for="charClass" class="char-field-label">Class</label>
            </div>
            <div class="char-race char-field-wrapper">
                <p>Yuan-Ti Gorgon (Homebrew)</p>
                <label for="charRace" class="char-field-label">Race</label>
            </div>
            <div class="char-player-name char-field-wrapper">
                <p>Ethel</p>
                <label for="charPlayerName" class="char-field-label">Player name</label>
            </div>
            <div class="char-background char-field-wrapper">
                <p>Background</p>
                <label for="charBackground" class="char-field-label">Background</label>
            </div>
            <div class="char-alignment char-field-wrapper">
                <p>Neutral Good</p>
                <label for="charAlignment" class="char-field-label">Alignment</label>
            </div>
            <div class="char-level char-field-wrapper">
                <p>12</p>
                <label for="charLevel" class="char-field-label">Level</label>
            </div>
        </div>

    </section>

    <section class="char-sheet-page">

        <!-- Ability Scores - vertical or horizontal tile -->
        {% include 'partials/sheet_ability_scores.html' %}

        <div class="char-sheet-column">
            <article class="char-inspiration char-border-grey p-2">
                <div class="text-center">
                    <input type="checkbox" id="inspirationCheckbox">
                    <label for="inspirationCheckbox" class="char-field-label">Inspiration</label>
                </div>
            </article>
            <!-- Saving Throws - vertical tile -->
            {% include 'partials/sheet_saving_throws.html' %}

            <!-- Skills - vertical tile -->
            {% include 'partials/sheet_skills.html' %}
        </div>

    </section>

    <style nonce="{{ csp_nonce }}">

        .char-border-grey {
            border: solid 0.2rem var(--grey-color);
            border-radius: 1rem;
        }

        .char-sheet {
            width: 100%;
            height: fit-content;
            padding: 1rem;
            border: var(--grey-color) solid 0.2rem;
            border-radius: 1rem;
        }

        .char-sheet p {
            margin-bottom: 0;
        }

        .char-sheet-header {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .char-sheet-page {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .char-sheet-column {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .char-field-wrapper {
            display: flex;
            flex-direction: column;
        }

        .char-field-label {
            margin-bottom: 0;
            font-size: 0.9rem;
            color: var(--dark-grey-color);
        }

        .char-name-text {
            font-size: 2rem;
            margin-bottom: 0;
        }

        .char-info {
            display: grid;
            gap: 0.5rem 1rem;
            grid-template-columns: repeat(3, 1fr);
            width: fit-content;
            padding: 1rem;
            border: var(--grey-color) solid 0.2rem;
            border-radius: 1rem;
        }

        /* Abilities */
        .char-ability-score-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 1rem;
            width: 100%;
        }

        .char-ability-score-container.vertical {
            grid-template-columns: minmax(110px, 1fr);
            width: fit-content;
        }

        .char-ability-score-card {
            display: flex;
            flex-direction: column;
            min-width: fit-content;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border: var(--grey-color) solid 0.2rem;
            border-radius: 1rem;
        }

        .char-ability-score {
            font-size: 1.5rem;
        }

        .char-ability-score-mod {
            font-weight: bold;
            font-size: 1.25rem;
        }

        /* Saving throws */
        .saving-throw-container {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            /* width: fit-content; */
            height: fit-content;
            padding: 0.5rem;
            border: var(--grey-color) solid 0.2rem;
            border-radius: 1rem;
        }

        .saving-throw-row {
            display: grid;
            grid-template-columns: 1rem 2rem auto 1.75rem;
            gap: 0.5rem;
            width: 100%;
            align-items: center;
        }

        .saving-throw-mod,
        .skill-mod {
            text-align: center;
        }

        /* Skills */
        .skill-row {
            display: grid;
            grid-template-columns: 1.25rem 2rem auto 2.5rem 1.75rem;
            gap: 0.5rem;
            width: 100%;
            align-items: center;
        }

        .skill-ability-hint {
            color: var(--grey-color);
            /* text-align: center; */
        }

        .roll-state-toggle {
            background-color: var(--light-grey-color);
            border-radius: 0.5rem;
            /* padding: 0.25rem 0.125rem; */
            transition: all 0.2s ease-in-out;
        }

        .saving-throw-row[data-state="adv"] .roll-state-toggle {
            background-color: var(--green-color);
        }
    </style>

</article>
