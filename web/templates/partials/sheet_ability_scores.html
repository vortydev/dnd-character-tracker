<article class="char-ability-score-container vertical">
    <div id="abilityCardStr" class="char-ability-score-card" data-ability-type="str">
        <label class="char-field-label">Strength</label>
        <p class="char-ability-score">10</p>
        <p class="char-ability-score-mod">0</p>
    </div>

    <div id="abilityCardDex" class="char-ability-score-card" data-ability-type="dex">
        <label class="char-field-label">Dexterity</label>
        <p class="char-ability-score">20</p>
        <p class="char-ability-score-mod">+5</p>
    </div>

    <div id="abilityCardCon" class="char-ability-score-card" data-ability-type="con">
        <label class="char-field-label">Constitution</label>
        <p class="char-ability-score">15</p>
        <p class="char-ability-score-mod">+2</p>
    </div>

    <div id="abilityCardInt" class="char-ability-score-card" data-ability-type="int">
        <label class="char-field-label">Intelligence</label>
        <p class="char-ability-score">18</p>
        <p class="char-ability-score-mod">+4</p>
    </div>

    <div id="abilityCardWis" class="char-ability-score-card" data-ability-type="wis">
        <label class="char-field-label">Wisdom</label>
        <p class="char-ability-score">14</p>
        <p class="char-ability-score-mod">+2</p>
    </div>

    <div id="abilityCardCha" class="char-ability-score-card" data-ability-type="cha">
        <label class="char-field-label">Charisma</label>
        <p class="char-ability-score">20</p>
        <p class="char-ability-score-mod">+5</p>
    </div>
</article>
